name: P10.3.1 Validación del análisis hebreo
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/P10/**'
      - 'docs/P8/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pilot-hebrew-p1031.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot-hebrew:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verificar cobertura hebrea y barreras
        run: |
          npm ci
          node --test tests/p1031-hebrew-validation.test.mjs
          node scripts/validate-hebrew-p1031.mjs
          npm run check
          npm test
          npm run build
          npm run test:build
          node scripts/verify-manuscript-pilot-build.mjs
