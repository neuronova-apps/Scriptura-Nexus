name: P11.4.4.2 Propuesta léxica y concordancias ampliadas
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/P11/**'
      - 'docs/P8/**'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/lexical-proposal-p11442.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lexical-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHON: python
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Propuesta griega y selectores comprobados
        run: |
          python -m unittest discover -s tests -p test_lexical_p11442.py
          python scripts/review-lexical-p11442.py
      - name: Compilación y barrera pública
        run: |
          npm ci
          npm run build
          npm run test:build
      - name: Concordancia privada de siete libros
        run: node scripts/validate-concordance-p11442.mjs
      - name: Barrera pública posterior
        run: npm run test:build
