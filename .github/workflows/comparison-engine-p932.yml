name: P9.3.2 Motor de comparación textual
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/comparison-engine-p932.py'
      - 'scripts/alignment-contracts-p931.py'
      - 'scripts/reader-navigation-p922.py'
      - 'scripts/project-textual-p913.py'
      - 'scripts/validate-editions-p912.py'
      - 'scripts/audit-editions-p91.py'
      - 'docs/P9/*.json'
      - 'tests/test_comparison_engine_p932.py'
      - '.github/workflows/comparison-engine-p932.yml'
      - 'src/data/linguistica/registro.json'
      - 'src/data/publicaciones/registro.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pruebas del motor y regresión de contratos ENT30
        run: |
          python3 -m unittest discover -s tests -p 'test_alignment_contracts_p931.py'
          python3 -m unittest discover -s tests -p 'test_comparison_engine_p932.py'
      - name: Auditoría de las 39041 consultas reales sin alineación automática
        run: python3 scripts/comparison-engine-p932.py
