name: P11.4.7.2 Validación conjunta privada de los cinco módulos
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/integral-private-browser-p11472.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integral-private-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHON: python
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regresiones y barreras públicas
        run: npm ci && npm run check && npm test && npm run build && npm run test:build
      - name: Navegación y consultas en contexto combinado
        run: |
          deps="$RUNNER_TEMP/p11472-browser"
          mkdir -p "$deps"
          npm install --prefix "$deps" --no-save --package-lock=false playwright@1.56.1
          "$deps/node_modules/.bin/playwright" install --with-deps chromium
          P11472_DEPS="$deps" node --max-old-space-size=4096 scripts/validate-integral-private-browser-p11472.mjs
      - name: Barrera pública posterior
        run: npm run test:build && node scripts/verify-manuscript-pilot-build.mjs
