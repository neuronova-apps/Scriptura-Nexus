name: P11.4.2.5 Preparación de publicación del lector
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/P11/**'
      - 'docs/P9/**'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/reader-release-preparation-p11425.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-release-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Barreras, pruebas y build público
        run: |
          npm ci
          node scripts/validate-reader-preparation-p11425.mjs
          node scripts/validate-reader-manual-p11425.mjs
          node scripts/validate-reader-rights-review-p11425.mjs
          node scripts/validate-reader-authorization-p11425.mjs
          node scripts/validate-reader-artifact-plan-p11425.mjs
          npm run check
          npm test
          npm run build
          npm run test:build
          node scripts/verify-manuscript-pilot-build.mjs
      - name: Comprobar vista local aislada
        run: |
          deps="$RUNNER_TEMP/p11425-browser"
          mkdir -p "$deps"
          npm install --prefix "$deps" --no-save --package-lock=false playwright@1.56.1
          "$deps/node_modules/.bin/playwright" install chromium
          if ! node -e 'const {chromium}=require(process.argv[1]);(async()=>{const b=await chromium.launch({headless:true});await b.close();})().catch(()=>process.exit(1))' "$deps/node_modules/playwright"; then
            "$deps/node_modules/.bin/playwright" install --with-deps chromium
          fi
          P11425_DEPS="$deps" node scripts/validate-reader-preview-p11425.mjs
          P11425_DEPS="$deps" node scripts/validate-reader-candidate-p11425.mjs
          P11425_DEPS="$deps" node scripts/validate-reader-candidate-p11425.mjs --staged-artifact
