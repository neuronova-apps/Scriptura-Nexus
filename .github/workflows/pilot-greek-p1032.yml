name: P10.3.2 Validación del análisis griego
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/P10/**'
      - 'docs/P8/**'
      - 'docs/P9/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pilot-greek-p1032.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot-greek:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validar cobertura textual y lingüística independiente
        run: |
          npm ci
          node --test tests/p1032-greek-validation.test.mjs
          node scripts/validate-greek-p1032.mjs
          python3 scripts/audit-greek-text-p1032.py
          npm run check
          npm test
          npm run build
          npm run test:build
          node scripts/verify-manuscript-pilot-build.mjs
