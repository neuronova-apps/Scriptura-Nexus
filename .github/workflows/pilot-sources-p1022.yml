name: P10.2.2 Selección y verificación de fuentes
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/P10/**'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pilot-sources-p1022.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verificar inventario y regresiones
        run: |
          npm ci
          node scripts/validate-p1021.mjs
          node scripts/validate-p1022.mjs
          npm run check
          npm test
          npm run build
          npm run test:build
          node scripts/verify-manuscript-pilot-build.mjs
