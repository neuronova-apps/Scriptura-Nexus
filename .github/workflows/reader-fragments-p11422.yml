name: P11.4.2.2 Proyección aislada de fragmentos del lector
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/P11/**'
      - 'docs/P9/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/reader-fragments-p11422.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-fragments:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Contrato, pruebas sintéticas y proyección real en memoria
        run: |
          python3 -m unittest discover -s tests -p 'test_reader_fragments_p11422.py'
          python3 scripts/project-reader-fragments-p11422.py
      - name: Regresiones y barreras de publicación
        run: |
          npm ci
          node scripts/validate-reader-rights-p11421.mjs
          npm run check
          npm test
          npm run build
          npm run test:build
          node scripts/verify-manuscript-pilot-build.mjs

  reader-windows-alternative:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Contrato de Windows y fuente alternativa fijada
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_reader_fragments_p11422.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import runpy; m=runpy.run_path('scripts/serve-reader-isolated-p11423.py'); catalog,data=m['build'](use_rv_alternative=True); assert len(data)==1449; print('Windows: 1449 verified fragments; publication disabled')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
