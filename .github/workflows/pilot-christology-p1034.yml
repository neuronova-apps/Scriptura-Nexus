name: P10.3.4 Validación del análisis cristológico
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/P10/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pilot-christology-p1034.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot-christology:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validar contextos, atribución y referencias
        run: |
          npm ci
          node --test tests/p1034-christology-validation.test.mjs
          node scripts/validate-christology-p1034.mjs
          python3 scripts/audit-christology-context-p1034.py
          npm run check
          npm test
          npm run build
          npm run test:build
          node scripts/verify-manuscript-pilot-build.mjs
