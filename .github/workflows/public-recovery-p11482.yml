name: P11.4.8.2 Ensayo de recuperación no destructivo
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/**'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-recovery-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Regresiones y compilación pública
        run: npm ci && npm run check && npm test && npm run build && npm run test:build && node scripts/verify-manuscript-pilot-build.mjs
      - name: Ensayo de recuperación en copias temporales
        run: node scripts/validate-public-recovery-p11482.mjs
      - name: Verificar barreras públicas posteriores
        run: npm run test:build && node scripts/verify-manuscript-pilot-build.mjs
