name: P8.4.4 Motor de concordancias
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/concordance.ts'
      - 'src/lib/term-analyzer.ts'
      - 'src/lib/linguistic-contracts.ts'
      - 'scripts/validate-concordance-p84.mjs'
      - 'scripts/lib/term-analyzer-validation-data.mjs'
      - 'scripts/lib/oshb-*.mjs'
      - 'scripts/lib/greek-projection.mjs'
      - 'docs/P8/*.json'
      - 'src/data/linguistica/registro.json'
      - 'tests/p8-concordance.test.mjs'
      - '.github/workflows/concordance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concordance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Pruebas sintéticas de concordancia
        run: node --test tests/p8-concordance.test.mjs
      - name: Validación de concordancia real aislada
        run: node scripts/validate-concordance-p84.mjs
