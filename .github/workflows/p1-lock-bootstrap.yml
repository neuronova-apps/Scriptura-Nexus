name: P1 - incorporar lockfile verificado
on:
  push:
    branches: ['feature/p1-infraestructura']
    paths: ['.github/workflows/p1-lock-bootstrap.yml']
permissions: {}
jobs:
  import-lock:
    if: github.ref == 'refs/heads/feature/p1-infraestructura'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p1-infraestructura
      - uses: actions/download-artifact@v4
        with:
          name: package-lock
          run-id: 45745845422
          github-token: ${{ github.token }}
          path: .p1-lock-import
      - name: Verificar e incorporar únicamente el lockfile aprobado
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e package-lock.json
          echo '772122344ecf9a8d7c51eaa20ae976024380a5566befc7ea8b94401ed7f6b1cf  .p1-lock-import/package-lock.json' | sha256sum -c -
          mv .p1-lock-import/package-lock.json package-lock.json
          rmdir .p1-lock-import
          git add -- package-lock.json
          test "$(git diff --cached --name-only)" = package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(p1.2): versionar lockfile verificado de CI'
          git push origin HEAD:refs/heads/feature/p1-infraestructura
