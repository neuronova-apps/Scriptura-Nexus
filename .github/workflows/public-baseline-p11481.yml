name: P11.4.8.1 Línea base pública y verificación de artefacto
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/**'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-baseline-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Regresiones y build inicial
        run: npm ci && npm run check && npm test && npm run build && npm run test:build && node scripts/verify-manuscript-pilot-build.mjs
      - name: Inventario y reconstrucción de línea base
        run: node scripts/validate-public-baseline-p11481.mjs
      - name: Barreras después de reconstrucción
        run: npm run test:build && node scripts/verify-manuscript-pilot-build.mjs
