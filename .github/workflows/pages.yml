name: Infraestructura y Pages
on:
  push:
    branches: [main, 'feature/p1-infraestructura']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scriptura-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Entorno
        run: node --version && npm --version
      - name: Preparar lockfile para revisión si falta
        if: hashFiles('package-lock.json') == ''
        run: npm install --package-lock-only --ignore-scripts
      - name: Conservar lockfile generado
        if: hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 7
      - name: Instalación limpia
        run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:build
      - name: Verificar lockfile versionado
        run: git ls-files --error-unmatch package-lock.json
      - name: Artefacto Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
