name: P8.3.5 Validación integral aislada
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/validate-term-analyzer-browser.mjs'
      - 'scripts/lib/term-analyzer-validation-data.mjs'
      - 'src/lib/term-analyzer*.ts'
      - 'src/scripts/term-analyzer-ui.ts'
      - 'src/pages/linguistica/analizador.astro'
      - 'src/styles/term-analyzer.css'
      - 'src/styles/design-tokens.css'
      - 'src/data/linguistica/registro.json'
      - 'docs/P8/*.json'
      - '.github/workflows/term-analyzer-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Instalación limpia y compilación
        run: npm ci && npm run build && npm run test:build
      - name: Dependencias de navegador aisladas (sin cambiar lockfile)
        run: |
          mkdir -p "$RUNNER_TEMP/p835-browser"
          npm install --prefix "$RUNNER_TEMP/p835-browser" --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
          "$RUNNER_TEMP/p835-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "P835_DEPS=$RUNNER_TEMP/p835-browser" >> "$GITHUB_ENV"
      - name: Interacción real y accesibilidad automatizada sin publicación
        run: node scripts/validate-term-analyzer-browser.mjs
