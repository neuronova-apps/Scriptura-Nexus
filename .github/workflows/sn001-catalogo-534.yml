name: SN-001 - Catálogo y buscador 5.3.4
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    if: github.head_ref == 'research/sn-001-catalogo-534' || github.ref_name == 'research/sn-001-catalogo-534'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python scripts/audit-sn001-531.py
      - run: node scripts/validate-sn001-531.mjs
      - name: Compilación pública sin candidato
        run: npm run build
      - name: Validar y generar revisión aislada
        run: node scripts/preview-sn001-532.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sn001-catalogo-534-revision
          path: sn001-review-output
          if-no-files-found: error
