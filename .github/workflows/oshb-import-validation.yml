name: P8.2.2 Validación importador OSHB
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/oshb-osis.py'
      - 'scripts/lib/oshb-importer.mjs'
      - 'scripts/lib/oshb-occurrences.mjs'
      - 'scripts/lib/oshb-lexical.mjs'
      - 'scripts/lib/oshb-morphology.mjs'
      - 'scripts/lib/oshb-integrity.mjs'
      - 'tests/p8-oshb-integrity.test.mjs'
      - 'tests/p8-oshb-morphology.test.mjs'
      - 'tests/p8-oshb-lexical.test.mjs'
      - 'tests/p8-oshb-occurrences.test.mjs'
      - 'src/lib/linguistic-contracts.ts'
      - 'scripts/import-oshb.mjs'
      - 'scripts/lib/linguistic-admission.mjs'
      - 'scripts/lib/linguistic-audit.mjs'
      - 'docs/P8/candidatos-linguisticos.json'
      - 'tests/p8-oshb-importer.test.mjs'
      - '.github/workflows/oshb-import-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-oshb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Intérprete XML aislado
        run: python3 --version
      - name: Pruebas sintéticas
        run: node --test tests/p8-oshb-importer.test.mjs
      - name: Importación real reproducible sin persistencia
        run: node scripts/import-oshb.mjs
      - name: Unidades y ocurrencias sintéticas
        run: node --test tests/p8-oshb-occurrences.test.mjs
      - name: Unidades y ocurrencias reales reproducibles
        run: node scripts/import-oshb.mjs --occurrences
      - name: Lemas y códigos léxicos sintéticos
        run: node --test tests/p8-oshb-lexical.test.mjs
      - name: Lemas y códigos léxicos reales reproducibles
        run: node scripts/import-oshb.mjs --lexical
      - name: Morfología sintética
        run: node --test tests/p8-oshb-morphology.test.mjs
      - name: Morfología real y auditoría TEHMC
        run: node scripts/import-oshb.mjs --morphology
      - name: Integridad y Unicode sintéticos
        run: node --test tests/p8-oshb-integrity.test.mjs
      - name: Auditoría de cobertura e integridad real
        run: node scripts/import-oshb.mjs --integrity
