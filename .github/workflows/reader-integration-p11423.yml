name: P11.4.2.3 Integración aislada del lector
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/P11/**'
      - 'docs/P9/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/reader-integration-p11423.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Pruebas, compilación y barreras
        run: |
          npm ci
          node scripts/validate-reader-plan-p11423.mjs
          node --test tests/p11423-reader-fragment-view.test.mjs
          npm run check
          npm test
          npm run build
          npm run test:build
          node scripts/verify-manuscript-pilot-build.mjs
      - name: Integración real en memoria y regresión Chromium
        run: |
          deps="$RUNNER_TEMP/p11423-browser"
          mkdir -p "$deps"
          npm install --prefix "$deps" --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
          "$deps/node_modules/.bin/playwright" install --with-deps chromium
          P11423_DEPS="$deps" node scripts/validate-reader-integration-p11423.mjs
          P924_DEPS="$deps" node scripts/validate-reader-browser-p924.mjs
