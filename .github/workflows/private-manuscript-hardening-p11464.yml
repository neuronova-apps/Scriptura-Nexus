name: P11.4.6.4 Integridad y accesibilidad de manuscritos privados
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/P11/**'
      - 'docs/P9/**'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/private-manuscript-hardening-p11464.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-manuscript-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Regresiones, integridad y barreras públicas
        run: npm ci && npm run check && npm test && npm run build && npm run test:build && node scripts/verify-manuscript-pilot-build.mjs
      - name: Candidato privado, recuperación, privacidad y axe
        run: |
          deps="$RUNNER_TEMP/p11464-browser"
          mkdir -p "$deps"
          npm install --prefix "$deps" --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
          "$deps/node_modules/.bin/playwright" install --with-deps chromium
          P11464_DEPS="$deps" node scripts/validate-private-manuscript-hardening-p11464.mjs
