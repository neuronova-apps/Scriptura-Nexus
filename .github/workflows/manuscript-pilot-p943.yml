name: P9.4.3 Muestra documental de manuscritos
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/manuscript-pilot.ts'
      - 'src/lib/manuscript-contracts.ts'
      - 'tests/p943-manuscript-pilot.test.mjs'
      - 'docs/P9/muestra-manuscritos-p943.json'
      - 'docs/P9/registro-manuscritos-p942.json'
      - 'docs/P9/proyeccion-ediciones-p913.json'
      - 'docs/P9/15-manuscritos-documentados.md'
      - 'scripts/verify-manuscript-pilot-build.mjs'
      - '.github/workflows/manuscript-pilot-p943.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validar muestra y regresión de contratos
        run: |
          npm ci
          npm run check
          node --test tests/p942-manuscript-contracts.test.mjs tests/p943-manuscript-pilot.test.mjs
      - name: Verificar exclusión del piloto del artefacto público
        run: |
          npm run build
          node scripts/verify-manuscript-pilot-build.mjs
          npm run test:build
      - name: Mantener las restricciones de P9.4.1
        run: |
          python3 -m unittest discover -s tests -p test_manuscript_candidates_p941.py
          python3 scripts/audit-manuscript-candidates-p941.py
